name: CI-CD

on: 
   push:
    branches: Main


jobs: 
    Build:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout Code
              uses: actions/checkout@v4

            - name: Build Image
              run: npm install

    Testing:
        runs-on: ubuntu-latest
        needs:  Build

        steps:
            - name: Checkout Code
              uses: actions/checkout@v4

            - name: Test 
              run: npm test


