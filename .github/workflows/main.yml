name: CI-CD

on: 
   push:
    branches: Main


jobs: 
    Build:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout Code
              uses: actions/checkout@v4
              with:
                fetch-depth: 0

            - name: Build Image
              run: npm install

    Testing:
        runs-on: ubuntu-latest
        needs:  Build

        steps:
            - name: Checkout Code
              uses: actions/checkout@v4
              with:
                fetch-depth: 0

            - name: Test 
              run: npm test

            - name: Notify Test Failure
              if: failure()
              run: "echo 'This build failed, check logs' "


